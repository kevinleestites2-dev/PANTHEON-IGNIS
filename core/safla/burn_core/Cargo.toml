[package]
name = "burn_core"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.14.0", features = ["wgpu", "train"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[lib]
name = "burn_core"
path = "src/lib.rs"
